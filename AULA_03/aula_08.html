<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="get">
        <fieldset>
            <legend>Estado Civil</legend>
            <p>
                <input type="radio" name="estado_civil" value="casado" id="casado">
                <label for="casado">Casado</label>
            </p>
            <p>
                <input type="radio" name="estado_civil" value="solteiro" id="solteiro">
                <label for="solteiro">Solteiro</label>
            </p>
            <p>
                <input type="radio" name="estado_civil" value="divorciado" id="divorciado">
                <label for="divorciado">Divorciado</label>
            </p>
            <p>
                <input type="radio" name="estado_civil" value="viuvo" id="viuvo">
                <label for="viuvo">Viuvo</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Equipamentos</legend>
            <p>
                <input type="checkbox" value="monitor" name="monitor" id="monitor">
                <label for="monitor">Monitor</label>
            </p>
            <p>
                <input type="checkbox" value="Impressora" name="Impressora" id="Impressora">
                <label for="impressora">Impressora</label>
            </p>
            <p>
                <input type="checkbox" value="mouse" name="mouse" id="mouse">
                <label for="mouse">Mouse</label>
            </p>
            <p>
                <input type="checkbox" value="teclado" name="teclado" id="teclado">
                <label for="teclado">Teclado</label>
            </p>
        </fieldset>
        <p>
            <label for="busca">Pesquisa</label>
            <input type="search" id="search" name="search" />
        </p>
        <p>
            <label for="color">Cor</label>
            <input type="color" id="color" name="color" />
        </p>
        <p>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" cols="30"></textarea>
        </p>
        <p>
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="0" disabled selected>Escolha uma opção</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                </textarea>
        </p>
        <p>
            /*ioptgroup*/
        </p>
        <p>
            <input type="submit" value="Enviar dados" />
        </p>
    </form>
    <hr>
    <details>
        <summary>Exibir/Ocultar</summary>
        <p>teste</p>
    </details>
</body>

</html>
