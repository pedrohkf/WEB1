<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="display: flex; gap: 4rem;">
    <section>
        <a href="page1.html">Voltar</a>
        <br>
        <form action="" method="get">
            <fieldset>
                <legend>Principal</legend>
                <p>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </p>
                <p>
                    <label for="data">Data de nascimento</label>
                    <input type="date" id="data" name="data" required>
                </p>
                <p>
                    <input type="radio" value="feminino" name="sexo" id="feminino">
                    <label for="feminino">Feminino</label>
                </p>
                <p>
                    <input type="radio" value="masculino" name="sexo" id="masculino">
                    <label for="masculino">Masculino</label>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Endereco</legend>
                <p>
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="Digite o nome da usa rua" required>
                </p>
                <p>
                    <label for="number">Numero da casa</label>
                    <input type="text" id="number" name="number" placeholder="Digite seu numero de casa" required>
                </p>
                <p>
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" required>
                </p>
                <p>
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="0" disabled selected>Escolha uma opção</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </p>
                <p>
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Contato</legend>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </p>
                <p>
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Area de interesse</legend>
                <p>
                    <input type="checkbox" name="area" value="computacao" id="computacao">
                    <label for="computacao">Computação</label>
                </p>
                <p>
                    <input type="checkbox" name="area" value="engenharia" id="engenharia">
                    <label for="engenharia">Engenharia</label>
                </p>
                <p>
                    <input type="checkbox" name="area" value="historia" id="historia">
                    <label for="historia">História</label>
                </p>
                <p>
                    <input type="checkbox" name="area" value="pedagogia" id="pedagogia">
                    <label for="pedagogia">Pedagogia</label>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Sistema</legend>
                <p>
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuario" required>
                </p>
                <p>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </p>
                <input type="submit" value="Enviar Dados">
            </fieldset>
        </form>
    </section>
</body>

</html>
